<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="header">
      <h1>Snake</h1>
      <div class="hud" aria-live="polite">
        <div class="stat">
          <span class="stat-label">Score</span>
          <strong id="score" class="stat-value">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <strong id="high-score" class="stat-value">0</strong>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-message">Press Start or Space</p>
        <button id="start-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
          Start
        </button>
      </div>
    </div>

    <p class="hint">Arrows or WASD to move · Space to start · P to pause</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
